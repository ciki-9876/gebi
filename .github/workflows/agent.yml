name: agent
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check-agent.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  review:
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check-agent.mjs --review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
