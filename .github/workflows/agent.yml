name: agent
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check-agent.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
