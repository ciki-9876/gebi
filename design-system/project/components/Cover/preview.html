  html, body { margin: 0; padding: 0; background: var(--bg); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg); }
  .cv { position: absolute; right: 0; top: 0; }
  .b4 { fill: var(--surface-4); }
  .ba { fill: var(--accent); }
  .bi { fill: var(--info); }
  .lg { rx: var(--r-lg); }
  .win rect { rx: var(--r-xs); }
  .w { fill: var(--surface-2); }
  .wl { fill: var(--accent); }
  .wd { fill: var(--text-on-accent); opacity: .22; }
  .name { position: absolute; left: 48px; bottom: 70px; margin: 0; font-family: var(--font-sans); font-weight: 700; font-size: 72px; line-height: .95; letter-spacing: -0.02em; color: var(--text-1); }
  .tag-line { position: absolute; left: 48px; bottom: 40px; margin: 0; max-width: 400px; font-family: var(--font-sans); font-size: 14px; color: var(--text-2); }
</style></head>
