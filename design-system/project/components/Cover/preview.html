<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; padding: 0; background: var(--surface-1); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--grain), var(--surface-1); }
  /* 舷窗：右侧一面圆角玻璃，窗外是地球的一角 */
  .win { position: absolute; right: 40px; top: 28px; width: 420px; height: 168px; border-radius: 48px; overflow: hidden; background: var(--bg-deep);
    box-shadow: inset 0 0 0 1px var(--border-2), inset 0 16px 36px var(--bg-deep), 0 0 0 10px var(--bg-deep), 0 0 0 11px var(--border-1); }
  .earth { position: absolute; left: 120px; top: 70px; width: 360px; height: 360px; border-radius: 50%;
    background: radial-gradient(circle at 40% 30%, var(--surface-3), var(--bg-deep) 70%); box-shadow: 0 0 0 10px var(--info-soft), 0 0 60px 20px var(--info-line); }
  .you { position: absolute; left: 236px; top: 112px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  /* 控制台：窗下一排键 */
  .keys { position: absolute; right: 40px; bottom: 30px; display: flex; gap: 12px; }
  .k { height: 46px; border-radius: var(--r-md); background: var(--key-face); box-shadow: var(--key-shadow); }
  .k.main { width: 190px; position: relative; }
  .k.main::before { content: ""; position: absolute; left: 14px; right: 14px; top: 7px; height: 2px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .k.s { width: 70px; }
  .lcd { width: 120px; height: 46px; border-radius: var(--r-md); background: var(--scanline), var(--screen); box-shadow: var(--recess); }
  .name { position: absolute; left: 48px; bottom: 70px; margin: 0; font-family: var(--font-sans); font-weight: 800; font-size: 60px; line-height: 1.05; letter-spacing: .02em; color: var(--text-1); }
  .tag-line { position: absolute; left: 48px; bottom: 40px; margin: 0; max-width: 400px; font-family: var(--font-sans); font-size: 14px; color: var(--text-2); }
</style></head>
<body>
<div class="cover">
  <h1 class="name">隔壁<br>设计系统</h1>
  <p class="tag-line">舷窗：界面长在舱壁上，地球在窗外。</p>
  <div class="win"><div class="earth"></div><i class="you"></i></div>
  <div class="keys"><i class="k main"></i><i class="k s"></i><i class="k s"></i><i class="lcd"></i></div>
</div>
</body>
</html>
